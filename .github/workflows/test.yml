name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Python dependencies
        run: cd backend && python -m pip install ruff
      
      - name: Lint backend with ruff
        run: cd backend && ruff check .
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Lint frontend with eslint
        run: cd frontend && npx eslint src --quiet

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        run: cd backend && python -m pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      
      - name: Run unit tests
        run: cd backend && python -m pytest tests/unit -v --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        run: cd backend && python -m pip install -r requirements.txt pytest pytest-asyncio httpx
      
      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: cd backend && python -m pytest tests/integration -v --tb=short

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install backend dependencies
        run: cd backend && python -m pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      
      - name: Run tests with coverage
        run: cd backend && python -m pytest --cov=. --cov-report=xml
