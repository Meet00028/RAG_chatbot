# Smoke test: 1 user, 1 minute
[smoke]
host = http://localhost:8000
users = 1
spawn-rate = 1
run-time = 1m

# Load test: 50 users, 5 minutes
[load]
host = http://localhost:8000
users = 50
spawn-rate = 5
run-time = 5m

# Stress test: 200 users, 10 minutes
[stress]
host = http://localhost:8000
users = 200
spawn-rate = 10
run-time = 10m

# Scale test: 1000 users, simulate daily usage
[scale]
host = http://localhost:8000
users = 1000
spawn-rate = 20
run-time = 15m
